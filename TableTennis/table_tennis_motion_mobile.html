<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Table Tennis 3D Motion (Mobile)</title>
  <style>
    :root {
      --bg-dark: #0a0e17;
      --bg-panel: rgba(16, 24, 39, 0.88);
      --bg-card: rgba(26, 38, 59, 0.8);
      --border-subtle: rgba(255, 255, 255, 0.12);
      --border-accent: rgba(0, 229, 255, 0.5);
      --primary: #00e5ff;
      --accent-red: #ff3366;
      --accent-green: #00e676;
      --accent-yellow: #ffd600;
      --accent-orange: #ff9100;
      --accent-purple: #b388ff;
      --text-main: #f0f4f8;
      --text-dim: #94a3b8;
      --font-mono: "SF Mono", "Roboto Mono", Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: var(--font-sans);
      color: var(--text-main);
      position: fixed;
    }

    #canvas-container {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
      touch-action: none;
    }

    /* Glass Panels */
    .glass-panel {
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    /* Top Bar */
    #top-bar {
      position: absolute;
      top: calc(10px + var(--safe-top));
      left: 12px;
      right: 12px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      font-size: 20px;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: #fff;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
    }

    .btn-icon:active {
      background: rgba(0, 229, 255, 0.25);
      color: var(--primary);
    }

    .btn-pill {
      height: 36px;
      padding: 0 12px;
      border-radius: 18px;
      background: rgba(0, 229, 255, 0.15);
      border: 1px solid var(--border-accent);
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    /* Camera Chips Scroll */
    #camera-chips {
      position: absolute;
      top: calc(66px + var(--safe-top));
      left: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px;
      z-index: 10;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    #camera-chips::-webkit-scrollbar { display: none; }

    .chip-btn {
      flex: 0 0 auto;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(16, 24, 39, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border-subtle);
      color: var(--text-dim);
      cursor: pointer;
    }

    .chip-btn.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
      font-weight: 700;
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
    }

    /* Floating Mini HUD */
    #mini-hud {
      position: absolute;
      top: calc(110px + var(--safe-top));
      left: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 9;
      pointer-events: none;
    }

    .hud-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(10, 16, 26, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-subtle);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11px;
    }

    .hud-num {
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--primary);
      font-size: 13px;
    }

    .phase-badge {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #000;
      background: var(--primary);
      padding: 3px 8px;
      border-radius: 6px;
      align-self: flex-start;
    }

    /* Bottom Controller Panel */
    #bottom-sheet {
      position: absolute;
      bottom: calc(10px + var(--safe-bottom));
      left: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 14px;
    }

    /* Stroke Stepper */
    .stroke-stepper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 4px 8px;
      font-size: 12px;
    }

    .step-arrow {
      background: transparent;
      border: none;
      color: var(--primary);
      font-size: 16px;
      padding: 4px 10px;
      cursor: pointer;
    }

    .stroke-title {
      font-weight: 700;
      color: #fff;
    }

    /* Mobile Timeline Touch Scrubber */
    .timeline-touch-box {
      position: relative;
      width: 100%;
      height: 48px;
      background: rgba(10, 16, 26, 0.7);
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      overflow: hidden;
      touch-action: none;
    }

    #mobile-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .scrubber-head {
      position: absolute;
      top: 0; bottom: 0;
      width: 3px;
      background: #fff;
      box-shadow: 0 0 10px #fff;
      transform: translateX(-50%);
      pointer-events: none;
    }

    /* Main Playback Bar */
    .playback-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .btn-play-large {
      width: 48px;
      height: 48px;
      border-radius: 24px;
      background: var(--primary);
      border: none;
      color: #000;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(0, 229, 255, 0.4);
    }
    .btn-play-large:active { transform: scale(0.95); }

    .time-mono {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dim);
    }
    .time-mono strong {
      color: var(--primary);
      font-size: 14px;
    }

    .speed-group {
      display: flex;
      gap: 3px;
      background: rgba(0, 0, 0, 0.35);
      padding: 3px;
      border-radius: 8px;
    }

    .speed-chip {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .speed-chip.active {
      background: rgba(0, 229, 255, 0.25);
      color: var(--primary);
    }

    /* Slide-Up Full Drawer */
    #drawer-modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      flex-direction: column;
      justify-content: flex-end;
    }

    .drawer-content {
      background: #111827;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      border: 1px solid var(--border-subtle);
      border-bottom: none;
      padding: 16px 20px calc(20px + var(--safe-bottom));
      max-height: 80vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .drawer-handle {
      width: 40px;
      height: 5px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      align-self: center;
      margin-bottom: 4px;
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }

    .stats-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat-box {
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .stat-label {
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .stat-number {
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }

    .stat-unit {
      font-size: 11px;
      font-weight: 400;
      color: var(--text-dim);
      margin-left: 2px;
    }

    .stroke-list-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 6px;
    }

    .stroke-chip-btn {
      padding: 8px 4px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
    }

    .stroke-chip-btn.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
    }
  </style>

  <!-- Three.js & OrbitControls: CDN with local offline fallback -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>

      document.write('<script src="js/OrbitControls.js"><\/script>');
    }
  </script>
</head>
<body>

  <!-- Top Bar -->
  <header id="top-bar" class="glass-panel">
    <div class="brand">
      <span class="brand-icon">🏓</span>
      <span class="brand-title">TT Motion 3D</span>
    </div>

    <div class="top-actions">
      <button class="btn-pill" id="btn-open-drawer">📊 Stats</button>
      <button class="btn-icon" id="btn-reset-cam" title="Reset View">🔄</button>
    </div>
  </header>

  <!-- Camera Chips -->
  <div id="camera-chips">
    <button class="chip-btn active" data-view="behind">👤 Player POV</button>
    <button class="chip-btn" data-view="side">📺 Side View</button>
    <button class="chip-btn" data-view="top">🦅 Top Down</button>
    <button class="chip-btn" data-view="follow">🏓 Follow Cam</button>
    <button class="chip-btn" data-view="opponent">🎯 Opponent</button>
  </div>

  <!-- Mini HUD -->
  <div id="mini-hud">
    <div id="hud-phase-badge" class="phase-badge">READY</div>
    <div class="hud-badge">
      <span>Speed:</span>
      <span class="hud-num" id="lbl-hud-speed">0.0</span>
      <span style="font-size:9px; color:var(--text-dim);">km/h</span>
    </div>
    <div class="hud-badge">
      <span>Impact:</span>
      <span class="hud-num" id="lbl-hud-accel">1.0</span>
      <span style="font-size:9px; color:var(--text-dim);">g</span>
    </div>
  </div>

  <!-- Bottom Sheet Controls -->
  <footer id="bottom-sheet" class="glass-panel">
    <!-- Stroke Stepper -->
    <div class="stroke-stepper">
      <button class="step-arrow" id="btn-step-prev">◀</button>
      <span class="stroke-title" id="lbl-stroke-title">Stroke #1 (28.3 km/h)</span>
      <button class="step-arrow" id="btn-step-next">▶</button>
    </div>

    <!-- Scrubber Canvas -->
    <div class="timeline-touch-box" id="timeline-touch-box">
      <canvas id="mobile-canvas"></canvas>
      <div class="scrubber-head" id="mobile-scrubber-head"></div>
    </div>

    <!-- Playback Row -->
    <div class="playback-row">
      <button class="btn-icon" id="btn-frame-prev" style="width:40px; height:40px;">⏮</button>
      <button class="btn-play-large" id="btn-play">▶</button>
      <button class="btn-icon" id="btn-frame-next" style="width:40px; height:40px;">⏭</button>

      <div class="time-mono">
        <strong id="lbl-cur-time">00:00.0</strong> / <span id="lbl-tot-time">00:28.8</span>
      </div>

      <div class="speed-group">
        <button class="speed-chip" data-speed="0.25">0.25x</button>
        <button class="speed-chip active" data-speed="1.0">1x</button>
        <button class="speed-chip" data-speed="2.0">2x</button>
      </div>
    </div>
  </footer>

  <!-- Slide-Up Drawer Modal -->
  <div id="drawer-modal">
    <div class="drawer-content">
      <div class="drawer-handle"></div>
      
      <div class="drawer-header">
        <div class="drawer-title" id="drawer-stroke-name">Stroke #1 Analysis</div>
        <button class="btn-icon" id="btn-close-drawer" style="width:32px; height:32px;">✕</button>
      </div>

      <div class="stats-2col">
        <div class="stat-box">
          <div class="stat-label">Peak Speed</div>
          <div class="stat-number"><span id="d-val-speed">28.3</span><span class="stat-unit">km/h</span></div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Max Acceleration</div>
          <div class="stat-number"><span id="d-val-accel">9.1</span><span class="stat-unit">g</span></div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Rotation Rate</div>
          <div class="stat-number"><span id="d-val-gyro">940</span><span class="stat-unit">°/s</span></div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Stroke Duration</div>
          <div class="stat-number"><span id="d-val-dur">1.59</span><span class="stat-unit">s</span></div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Swing Arc Length</div>
          <div class="stat-number"><span id="d-val-arc">3.35</span><span class="stat-unit">m</span></div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Shot Classification</div>
          <div class="stat-number" style="font-size:13px; line-height:22px; color:var(--primary);" id="d-val-class">Topspin Drive</div>
        </div>
      </div>

      <div style="font-size:12px; font-weight:700; color:var(--text-dim); text-transform:uppercase; margin-top:4px;">
        Quick Jump to Stroke (20 Rallies):
      </div>
      <div class="stroke-list-grid" id="stroke-grid-chips"></div>

      <button class="btn-pill" id="btn-drawer-focus-loop" style="width:100%; justify-content:center; height:42px; margin-top:8px;">
        🎯 Isolate & Loop Selected Stroke (0.25x)
      </button>
    </div>
  </div>

      const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      [-tableW / 2 + 0.01, tableW / 2 - 0.01].forEach(x => {
        const line = new THREE.Mesh(new THREE.PlaneGeometry(0.02, tableL), lineMat);
        line.rotation.x = -Math.PI / 2;
        line.position.set(x, tableH + 0.001, 0);
        tableGroup.add(line);
      });
      [-tableL / 2 + 0.01, tableL / 2 - 0.01].forEach(z => {
        const line = new THREE.Mesh(new THREE.PlaneGeometry(tableW, 0.02), lineMat);
        line.rotation.x = -Math.PI / 2;
        line.position.set(0, tableH + 0.001, z);
        tableGroup.add(line);
      });

      // Net
      const net = new THREE.Mesh(
        new THREE.PlaneGeometry(tableW + 0.3, 0.1525),
        new THREE.MeshStandardMaterial({ color: 0x222c3d, transparent: true, opacity: 0.85, side: THREE.DoubleSide })
      );
      net.position.set(0, tableH + 0.1525 / 2, 0);
      tableGroup.add(net);

      // Table Legs
      [[-tableW/2 + 0.15, -tableL/2 + 0.25],
       [ tableW/2 - 0.15, -tableL/2 + 0.25],
       [-tableW/2 + 0.15,  tableL/2 - 0.25],
       [ tableW/2 - 0.15,  tableL/2 - 0.25]].forEach(([x, z]) => {
        const leg = new THREE.Mesh(
          new THREE.BoxGeometry(0.04, tableH - 0.04, 0.04),
          new THREE.MeshStandardMaterial({ color: 0x1f2937 })
        );
        leg.position.set(x, (tableH - 0.04)/2, z);
        tableGroup.add(leg);
      });

      // Procedural Racket Model
      const paddle = new THREE.Group();
      scene.add(paddle);

      // Blade Core
      const bladeCore = new THREE.Mesh(
        new THREE.CylinderGeometry(0.075, 0.075, 0.011, 28),
        new THREE.MeshStandardMaterial({ color: 0xba8c53, roughness: 0.7 })
      );
      bladeCore.scale.set(1, 1, 1.1);
      bladeCore.rotation.x = Math.PI / 2;
      bladeCore.position.set(0, 0.055, 0);
      paddle.add(bladeCore);

      // Red Rubber (Front: +Z)
      const redFace = new THREE.Mesh(
        new THREE.CylinderGeometry(0.074, 0.074, 0.002, 28),
        new THREE.MeshStandardMaterial({ color: 0xd32f2f, roughness: 0.35 })
      );
      redFace.scale.set(1, 1, 1.1);
      redFace.rotation.x = Math.PI / 2;
      redFace.position.set(0, 0.055, 0.007);
      paddle.add(redFace);

      // Black Rubber (Back: -Z)
      const blackFace = new THREE.Mesh(
        new THREE.CylinderGeometry(0.074, 0.074, 0.002, 28),
        new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.4 })
      );
      blackFace.scale.set(1, 1, 1.1);
      blackFace.rotation.x = Math.PI / 2;
      blackFace.position.set(0, 0.055, -0.007);
      paddle.add(blackFace);

      // Handle
      const handle = new THREE.Mesh(
        new THREE.BoxGeometry(0.028, 0.095, 0.022),
        new THREE.MeshStandardMaterial({ color: 0xc89658, roughness: 0.6 })
      );
      handle.position.set(0, -0.05, 0);
      paddle.add(handle);

      // IMU Tracker with LED
      const tracker = new THREE.Mesh(
        new THREE.BoxGeometry(0.032, 0.02, 0.008),
        new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8 })
      );
      tracker.position.set(0, 0.005, -0.011);
      paddle.add(tracker);

      const led = new THREE.Mesh(
        new THREE.SphereGeometry(0.0025, 12, 12),
        new THREE.MeshBasicMaterial({ color: 0x00e5ff })
      );
      led.position.set(0.01, 0.005, -0.016);
      paddle.add(led);

      // Ball
      const ballMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.02, 24, 24),
        new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 })
      );
      ballMesh.visible = false;
      scene.add(ballMesh);

      // Motion Trail
      const MAX_TRAIL = 120;
      const trailPositions = new Float32Array(MAX_TRAIL * 3);
      const trailColors = new Float32Array(MAX_TRAIL * 3);
      const trailGeo = new THREE.BufferGeometry();
      trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
      trailGeo.setAttribute('color', new THREE.BufferAttribute(trailColors, 3));
      const trailLine = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({ vertexColors: true, linewidth: 3 }));
      scene.add(trailLine);

      function speedToRgb(spd) {
        const t = Math.min(1.0, Math.max(0.0, spd / 32.0));
        if (t < 0.5) return [0.0, 0.9, 1.0 - t * 1.5];
        return [1.0, 0.9 - (t - 0.5) * 1.6, 0.2];
      }

      // Camera Presets
      const VIEWS = {
        behind: { pos: [0.35, 1.45, 2.75], target: [0.25, 0.85, 0.8] },
        side: { pos: [2.6, 1.3, 1.1], target: [0.1, 0.85, 1.2] },
        top: { pos: [0.3, 3.6, 1.2], target: [0.3, 0.85, 1.1] },
        follow: { pos: [0.7, 1.15, 2.1], target: [0.3, 0.9, 1.4] },
        opponent: { pos: [0.0, 1.35, -1.8], target: [0.2, 0.9, 1.3] }
      };

      function setView(key) {
        currentView = key;
        const v = VIEWS[key];
        if (!v) return;
        controls.target.set(v.target[0], v.target[1], v.target[2]);
        camera.position.set(v.pos[0], v.pos[1], v.pos[2]);
        controls.update();

        document.querySelectorAll(".chip-btn").forEach(b => {
          b.classList.toggle("active", b.dataset.view === key);
        });
      }
      setView("behind");

      document.querySelectorAll(".chip-btn").forEach(btn => {
        btn.addEventListener("click", () => setView(btn.dataset.view));
      });
      document.getElementById("btn-reset-cam").addEventListener("click", () => setView(currentView));

      // Mobile Scrubber Canvas
      function drawMobileTimeline() {
        const w = timelineBox.clientWidth;
        const h = timelineBox.clientHeight;
        mobileCanvas.width = w * window.devicePixelRatio;
        mobileCanvas.height = h * window.devicePixelRatio;
        const ctx = mobileCanvas.getContext("2d");
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

        ctx.clearRect(0, 0, w, h);

        // Stroke bands
        data.strokes.forEach((s, idx) => {
          const x0 = (s.t_start / totalDuration) * w;
          const x1 = (s.t_end / totalDuration) * w;
          const isCur = selectedStrokeId === s.stroke_id;

          ctx.fillStyle = isCur ? "rgba(0, 229, 255, 0.3)" : (idx % 2 === 0 ? "rgba(255, 255, 255, 0.04)" : "rgba(255, 255, 255, 0.08)");
          ctx.fillRect(x0, 0, x1 - x0, h);

          // Impact line
          const xImp = (s.t_impact / totalDuration) * w;
          ctx.strokeStyle = isCur ? "rgba(255, 51, 102, 0.85)" : "rgba(255, 51, 102, 0.35)";
          ctx.beginPath();
          ctx.moveTo(xImp, 0); ctx.lineTo(xImp, h);
          ctx.stroke();
        });

        // Speed Curve
        ctx.beginPath();
        for (let i = 0; i < numSamples; i++) {
          const px = (data.t[i] / totalDuration) * w;
          const py = h - 4 - (data.speed[i] / 35.0) * (h - 12);
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.strokeStyle = "#00e5ff";
        ctx.lineWidth = 1.6;
        ctx.stroke();
      }

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        drawMobileTimeline();
      });
      drawMobileTimeline();

      // Touch Scrubber Interaction
      function seekFromTouch(e) {
        const rect = timelineBox.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const x = Math.max(0, Math.min(clientX - rect.left, rect.width));
        const t = (x / rect.width) * totalDuration;
        seekToTime(t);
      }

      let isTouchingTimeline = false;
      timelineBox.addEventListener("touchstart", e => { isTouchingTimeline = true; seekFromTouch(e); }, { passive: true });
      window.addEventListener("touchmove", e => { if (isTouchingTimeline) seekFromTouch(e); }, { passive: true });
      window.addEventListener("touchend", () => { isTouchingTimeline = false; });
      timelineBox.addEventListener("mousedown", e => { isTouchingTimeline = true; seekFromTouch(e); });
      window.addEventListener("mousemove", e => { if (isTouchingTimeline) seekFromTouch(e); });
      window.addEventListener("mouseup", () => { isTouchingTimeline = false; });

      function seekToTime(t) {
        currentTime = Math.max(0, Math.min(t, totalDuration));
        updateFrame();
      }

      // Stroke Selection
      function selectStroke(sid) {
        selectedStrokeId = sid;
        const s = data.strokes[sid - 1];
        if (!s) return;

        lblStrokeTitle.textContent = `Stroke #${s.stroke_id} (${s.max_speed_kmh} km/h)`;
        drawerStrokeName.textContent = `Stroke #${s.stroke_id} Analysis`;

        dValSpeed.textContent = s.max_speed_kmh;
        dValAccel.textContent = s.max_accel_g;
        dValGyro.textContent = s.max_gyro_degs;
        dValDur.textContent = s.duration_s;
        dValArc.textContent = s.path_length_m;
        dValClass.textContent = s.classification;

        document.querySelectorAll(".stroke-chip-btn").forEach(b => {
          b.classList.toggle("active", parseInt(b.dataset.id) === sid);
        });

        drawMobileTimeline();
      }
      selectStroke(1);

      btnStepPrev.addEventListener("click", () => {
        let sid = selectedStrokeId - 1;
        if (sid < 1) sid = data.num_strokes;
        selectStroke(sid);
        seekToTime(data.strokes[sid - 1].t_start);
      });

      btnStepNext.addEventListener("click", () => {
        let sid = selectedStrokeId + 1;
        if (sid > data.num_strokes) sid = 1;
        selectStroke(sid);
        seekToTime(data.strokes[sid - 1].t_start);
      });

      // Frame Stepping
      btnFramePrev.addEventListener("click", () => { setPlaying(false); seekToTime(currentTime - 0.01); });
      btnFrameNext.addEventListener("click", () => { setPlaying(false); seekToTime(currentTime + 0.01); });

      // Play / Pause
      function setPlaying(play) {
        isPlaying = play;
        btnPlay.textContent = isPlaying ? "⏸" : "▶";
      }
      btnPlay.addEventListener("click", () => setPlaying(!isPlaying));

      // Speed Chips
      document.querySelectorAll(".speed-chip").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".speed-chip").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          playbackSpeed = parseFloat(btn.dataset.speed);
        });
      });

      // Drawer Modal
      btnOpenDrawer.addEventListener("click", () => { drawerModal.style.display = "flex"; });
      btnCloseDrawer.addEventListener("click", () => { drawerModal.style.display = "none"; });
      drawerModal.addEventListener("click", e => { if (e.target === drawerModal) drawerModal.style.display = "none"; });

      btnDrawerFocusLoop.addEventListener("click", () => {
        isolateStrokeId = selectedStrokeId;
        const s = data.strokes[selectedStrokeId - 1];
        if (s) {
          seekToTime(s.t_start);
          playbackSpeed = 0.25;
          document.querySelectorAll(".speed-chip").forEach(b => b.classList.toggle("active", b.dataset.speed == "0.25"));
          setPlaying(true);
        }
        drawerModal.style.display = "none";
      });

      // Frame Update
      function updateFrame() {
        const sampleIdx = Math.min(numSamples - 1, Math.max(0, Math.round(currentTime * sampleRate)));
        const p = data.pos[sampleIdx];
        const q = data.quat[sampleIdx];
        paddle.position.set(p[0], p[1], p[2]);
        paddle.quaternion.set(q[0], q[1], q[2], q[3]);

        if (currentView === "follow") {
          controls.target.lerp(new THREE.Vector3(p[0], p[1], p[2]), 0.1);
          camera.position.set(p[0] + 0.45, p[1] + 0.3, p[2] + 0.65);
        }

        const curSpd = data.speed[sampleIdx];
        const curAcc = data.acc_g[sampleIdx];
        const curPhase = data.phase[sampleIdx];
        const curStrokeId = data.stroke_id[sampleIdx];

        lblHudSpeed.textContent = curSpd.toFixed(1);
        lblHudAccel.textContent = curAcc.toFixed(1);
        hudPhaseBadge.textContent = curPhase ? curPhase.toUpperCase() : "RALLY";
        lblCurTime.textContent = formatTime(currentTime);

        const pct = (currentTime / totalDuration) * 100;
        scrubberHead.style.left = `${pct}%`;

        if (curStrokeId > 0 && curStrokeId !== selectedStrokeId && !isolateStrokeId) {
          selectStroke(curStrokeId);
        }

        // Ball at impact
        const strokeMeta = data.strokes[curStrokeId - 1];
        if (strokeMeta && Math.abs(currentTime - strokeMeta.t_impact) < 0.05) {
          ballMesh.position.set(strokeMeta.impact_pos[0], strokeMeta.impact_pos[1], strokeMeta.impact_pos[2]);
          ballMesh.visible = true;
          hudPhaseBadge.style.background = "var(--accent-red)";
          hudPhaseBadge.textContent = "IMPACT!";
        } else {
          ballMesh.visible = false;
          hudPhaseBadge.style.background = "var(--primary)";
        }

        // Update trail
        const trailLen = Math.min(MAX_TRAIL, sampleIdx);
        const startIdx = Math.max(0, sampleIdx - MAX_TRAIL);
        let count = 0;
        for (let i = startIdx; i <= sampleIdx; i++) {
          const pt = data.pos[i];
          const rgb = speedToRgb(data.speed[i]);
          trailPositions[count * 3]     = pt[0];
          trailPositions[count * 3 + 1] = pt[1];
          trailPositions[count * 3 + 2] = pt[2];
          trailColors[count * 3]     = rgb[0];
          trailColors[count * 3 + 1] = rgb[1];
          trailColors[count * 3 + 2] = rgb[2];
          count++;
        }
        trailGeo.setDrawRange(0, count);
        trailGeo.attributes.position.needsUpdate = true;
        trailGeo.attributes.color.needsUpdate = true;
      }

      // Animation Loop
      let lastTime = performance.now();
      function animate(now) {
        requestAnimationFrame(animate);
        const delta = (now - lastTime) / 1000.0;
        lastTime = now;

        if (isPlaying) {
          currentTime += delta * playbackSpeed;
          if (isolateStrokeId !== null) {
            const s = data.strokes[isolateStrokeId - 1];
            if (currentTime > s.t_end) {
              currentTime = isLooping ? s.t_start : s.t_end;
              if (!isLooping) setPlaying(false);
            }
          } else {
            if (currentTime >= totalDuration) {
              currentTime = isLooping ? 0.04 : totalDuration;
              if (!isLooping) setPlaying(false);
            }
          }
          updateFrame();
        }

        controls.update();
        renderer.render(scene, camera);
      }

      seekToTime(0.04);
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
